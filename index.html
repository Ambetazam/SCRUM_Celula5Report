<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Sazón — Informe de Requisitos. Célula 5: Planificador de Menús y Lista de Mercado."
    >

    <title>Sazón — Célula 5 | Informe de Requisitos</title>

    <style>
        :root {
            --background: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --text: #f0f6fc;
            --muted: #8b949e;
            --accent: #58a6ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: var(--background);
            color: var(--text);
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        header {
            padding: 3rem 1.5rem 2rem;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            margin-bottom: 0.75rem;
        }

        header p {
            color: var(--muted);
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.7;
        }

        .container {
            width: min(1400px, 94%);
            margin: 0 auto;
            padding: 2rem 0 3rem;
        }

        .actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .button {
            display: inline-block;
            padding: 0.75rem 1.25rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            color: var(--text);
            text-decoration: none;
            transition: 0.2s ease;
        }

        .button:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-1px);
        }

        .viewer {
            width: 100%;
            height: 80vh;
            min-height: 650px;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            background: #ffffff;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        footer {
            padding: 2rem 1.5rem;
            text-align: center;
            color: var(--muted);
            border-top: 1px solid var(--border);
            line-height: 1.7;
        }

        footer strong {
            color: var(--text);
        }

        @media (max-width: 700px) {
            .viewer {
                height: 70vh;
                min-height: 500px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🍳 Sazón</h1>

    <p>
        Digital Recipe & Weekly Meal Planner
        <br>
        <strong>Célula 5 — Planificador de Menús y Lista de Mercado</strong>
    </p>
</header>

<main class="container">

    <div class="actions">
        <a
            class="button"
            href="INFORME_REQUISITOS_CELUlA_5.pdf"
            target="_blank"
            rel="noopener"
        >
            📄 Abrir PDF
        </a>

        <a
            class="button"
            href="INFORME_REQUISITOS_CELUlA_5.pdf"
            download
        >
            ⬇ Descargar informe
        </a>

        <a
            class="button"
            href="https://github.com/Ambetazam/SCRUM_MethodologyReport"
            target="_blank"
            rel="noopener"
        >
            GitHub Repository
        </a>
    </div>

    <section class="viewer" aria-label="Visor del informe de requisitos">
        <iframe
            src="INFORME_REQUISITOS_CELUlA_5.pdf"
            title="Informe de Requisitos — Célula 5"
        >
        </iframe>
    </section>

</main>

<footer>
    <p>
        <strong>Sazón — Célula 5</strong>
    </p>

    <p>
        Proyecto académico — Planificador de Menús y Lista de Mercado
    </p>

    <p>
        Documento presentado con fines exclusivamente educativos.
    </p>
</footer>

</body>
</html>
